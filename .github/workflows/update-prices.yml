name: Update CAISO prices

on:
  schedule:
    - cron: '30 12 * * *'
      timezone: America/Los_Angeles
    - cron: '0 15 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Optional start operating date (YYYY-MM-DD). Leave blank for rolling window.'
        required: false
        type: string
      end_date:
        description: 'Optional end operating date (YYYY-MM-DD). Leave blank for rolling window.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: caiso-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install runtime dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Refresh database and export website data
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: node scripts/update_prices.js
      - name: Commit updated database
        if: always() && hashFiles('data/mead_daily.db', 'public/data/days.json') != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mead_daily.db
          if ! git diff --cached --quiet; then
            git commit -m "Update CAISO MEAD price data"
            git push
          else
            echo 'No data changes to commit.'
          fi
